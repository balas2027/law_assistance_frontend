<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>NyayaAI Academy - Sign In</title>

                      "secondary-container": "#fe9832",
                      "on-secondary": "#ffffff",
                      "surface-dim": "#dadad7",
                      "surface-bright": "#f9f9f6",
                      "surface-container-low": "#f4f4f1",
                      "on-secondary-fixed": "#2e1500",
                      "surface-tint": "#4f5c8e",
                      "on-error": "#ffffff",
                      "on-tertiary": "#ffffff",
                      "inverse-on-surface": "#f1f1ee",
                      "surface-variant": "#e2e3e0",
                      "surface-container": "#eeeeeb",
                      "on-surface": "#1a1c1b",
                      "on-tertiary-container": "#38a429",

                      "on-primary-fixed": "#071747",
                      "outline": "#767680",

                      "tertiary-fixed": "#8dfc75",
                      "background": "#f9f9f6",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-high": "#e8e8e5"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "chat-gap": "12px",
                      "gutter": "24px",
                      "margin-desktop": "48px",
                      "base_unit": "8px",
                      "margin-mobile": "16px"
              },
              "fontFamily": {
                      "body-lg": [

                      ],
                      "h1": [

                      ],
                      "citation": [

                      ],

<style>
        .chakra-loader {
            border: 2px solid transparent;
            border-top-color: #FF9933;
            border-right-color: #172554;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-surface antialiased">
<!-- Main Container -->
<main class="w-full max-w-[440px] flex flex-col items-center">
<!-- Logo Header -->
<header class="mb-8 flex flex-col items-center text-center">
<div class="w-12 h-12 mb-4 bg-primary-container rounded-full flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-primary" style="font-variation-settings: &quot;FILL&quot; 1;">account_balance</span>
</div>
<h1 class="font-h1-mobile md:font-h1 text-h1-mobile md:text-h1 text-primary">NyayaAI&nbsp;</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Institutional Grade Legal Assistant</p>
</header>
<!-- Login Card -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-[0_2px_12px_rgba(23,37,84,0.06)] border border-[#E7E5DE] p-8">
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-caps text-label-caps text-primary mb-2 uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-[#E7E5DE] rounded-[12px] bg-surface-container-lowest text-on-surface font-body-md focus:outline-none focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-colors" id="email" name="email" placeholder="user@institution.edu" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-caps text-label-caps text-primary mb-2 uppercase tracking-wider" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-[#E7E5DE] rounded-[12px] bg-surface-container-lowest text-on-surface font-body-md focus:outline-none focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Actions Row -->
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 text-primary-container border-[#E7E5DE] rounded focus:ring-primary-container bg-surface-container-lowest" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-2 block font-body-md text-[14px] text-on-surface-variant" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-body-md text-[14px] font-medium text-primary-container hover:text-primary transition-colors" href="#">
                            Forgot Password?
                        </a>
</div>
</div>
<!-- Submit Button -->
<div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-sm font-label-caps text-label-caps uppercase tracking-wider text-on-primary bg-[#FF9933] hover:bg-secondary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary-container transition-colors" type="submit">
                        Sign In
                    </button>
</div>
</form>
</div>
<!-- Trust Badge / Footer -->
<footer class="mt-8 text-center flex flex-col items-center">
<div class="flex items-center justify-center space-x-2 text-outline">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="font-citation text-citation uppercase tracking-widest text-[11px]">Grounded in Indian Law</span>
</div>
<p class="mt-4 font-label-caps text-[11px] text-on-surface-variant">Protected by Institutional Grade Security</p>
</footer>
</main>


</body></html>
